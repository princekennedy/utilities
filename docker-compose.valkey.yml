name: ${VALKEY_NAME:-dev-valkey}

services:
  valkey:
    image: ${VALKEY_IMAGE:-valkey/valkey:latest}
    container_name: ${VALKEY_NAME:-dev-valkey}
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "${VALKEY_PORT:-6379}"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - traefik.docker.network=dokploy-network
    networks:
      production-network:
        aliases:
          - ${VALKEY_ALIAS:-dokploy-valkey}
          - ${VALKEY_NAME:-dev-valkey}
      dokploy-network:
        aliases:
          - ${VALKEY_ALIAS:-dokploy-valkey}
          - ${VALKEY_NAME:-dev-valkey}

networks:
  production-network:
    name: production-network
    external: true
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  valkey_data:
    name: ${VALKEY_VOLUME_NAME:-valkey_data}
