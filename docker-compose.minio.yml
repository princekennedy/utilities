name: ${MINIO_NAME:-dev-minio}

services:
  minio:
    image: ${MINIO_IMAGE:-elestio/minio:latest}
    container_name: ${MINIO_NAME:-dev-minio}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_PORT:-9000}"
      - "${MINIO_CONSOLE_PORT:-9001}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - traefik.docker.network=dokploy-network
    networks:
      production-network:
        aliases:
          - ${MINIO_ALIAS:-dokploy-minio}
          - ${MINIO_NAME:-dev-minio}
      dokploy-network:
        aliases:
          - ${MINIO_ALIAS:-dokploy-minio}
          - ${MINIO_NAME:-dev-minio}

networks:
  production-network:
    name: production-network
    external: true
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  minio_data:
    name: ${MINIO_VOLUME_NAME:-minio_data}
