name: ${MINIO_NAME:-prod-minio}

services:
  minio:
    image: elestio/minio:latest
    container_name: ${MINIO_NAME:-prod-minio}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # labels:
    #   traefik.docker.network: production-network
    networks:
      - production-network

volumes:
  minio_data:
    external: true

networks:
  production-network:
    external: true
