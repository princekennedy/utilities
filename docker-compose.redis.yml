name: ${REDIS_NAME:-prod-redis}

services:
  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    container_name: ${REDIS_NAME:-prod-redis}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - traefik.docker.network=dokploy-network
    networks:
      production-network:
        aliases:
          - dokploy-redis
      dokploy-network:
        aliases:
          - dokploy-redis

networks:
  production-network:
    name: production-network
    external: true
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  redis_data:
