name: ${MAIL_NAME:-assetminds-mailserver}

services:
  mailserver:
    image: ${MAIL_IMAGE:-analogic/poste.io:latest}
    container_name: ${MAIL_NAME:-assetminds-mailserver}
    restart: unless-stopped

    hostname: ${MAIL_HOSTNAME:-mail.${DOMAIN:-example.com}}

    environment:
      TZ: ${MAIL_TZ:-Africa/Blantyre}
      HTTPS: ${MAIL_HTTPS:-OFF}

    ports:
      - "${MAIL_WEB_PORT:-80}"
      - "${MAIL_SMTP_PORT:-25}"
      - "${MAIL_SUBMISSION_PORT:-587}"
      - "${MAIL_SMTPS_PORT:-465}"
      - "${MAIL_IMAP_PORT:-143}"
      - "${MAIL_IMAPS_PORT:-993}"
      - "${MAIL_POP3_PORT:-110}"
      - "${MAIL_POPS_PORT:-995}"
      - "${MAIL_SIEVE_PORT:-4190}"

    volumes:
      - poste-data:/data
      - /etc/localtime:/etc/localtime:ro

    labels:
      - traefik.docker.network=dokploy-network
      - "traefik.enable=${MAIL_TRAEFIK_ENABLE:-true}"
      - "traefik.http.routers.${MAIL_TRAEFIK_ROUTER:-poste}.rule=Host(`${MAIL_HOSTNAME:-mail.${DOMAIN:-example.com}}`)"
      - "traefik.http.routers.${MAIL_TRAEFIK_ROUTER:-poste}.entrypoints=${MAIL_TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${MAIL_TRAEFIK_ROUTER:-poste}.tls=${MAIL_TRAEFIK_TLS:-true}"
      - "traefik.http.services.${MAIL_TRAEFIK_ROUTER:-poste}.loadbalancer.server.port=${MAIL_WEB_PORT:-80}"

    networks:
      production-network:
        aliases:
          - ${MAIL_ALIAS:-dokploy-mail}
          - ${MAIL_NAME:-assetminds-mailserver}
      dokploy-network:
        aliases:
          - ${MAIL_ALIAS:-dokploy-mail}
          - ${MAIL_NAME:-assetminds-mailserver}

volumes:
  poste-data:
    name: ${MAIL_VOLUME_NAME:-${MAIL_NAME:-assetminds-mailserver}_poste-data}

networks:
  production-network:
    name: production-network
    external: true
  dokploy-network:
    name: dokploy-network
    external: true
